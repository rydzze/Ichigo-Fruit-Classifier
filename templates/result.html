<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ichigo | Result</title>
    <link rel="icon" href="{{ url_for('static', filename='img/ichigo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <header>ICHIGO</header>

    <main>
        <div class="results-container">
            <div class="white-box input-box">
                <h3>Input Image</h3>
                
                <img src="{{ url_for('routes.uploaded_file', filename=input_image) }}" alt="Uploaded Image">
            </div>

            <div class="white-box output-box">
                <h3 style="padding-bottom: 3rem;">Prediction Result</h3>

                <p><strong>Fruit:</strong> {{ fruit }}</p>
                <p><strong>Condition:</strong> {{ condition }}</p>
                
                <a href="/" class="button" style="margin-top: 3rem;">Return</a>
            </div>
        </div>
    </main>
</body>
</html>
